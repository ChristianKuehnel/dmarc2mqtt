mqtt:
  server_name: "mqtt.example.local"
  server_port: 8883
  login: "dmarc2mqtt"
  password: "change-me"
  base_topic: "mail/dmarc"
  tls: true
  allow_insecure: false
  remove_stale_sensors: 30
  max_history_entries: 1000
imap:
  mailboxes:
    - name: "primary"
      server_name: "imap.example.com"
      server_port: 993
      login: "user@example.com"
      password: "change-me"
      report_folder: "INBOX/DMARC"
      trash_folder: "INBOX/Trash"
      move_emails: false
      poll_cron: "0 0 */6 * * *"
      max_xml_size: 10
      max_message_size: 25
      max_attachment_size: 10
      max_zip_entries: 1000
      max_zip_xml_files: 10
      max_zip_uncompressed_size: 10
      max_report_org_name_length: 128
      max_report_domain_length: 253
