[package]
name = "dmarc2mqtt"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = true }
cron = "0.15"
env_logger = "0.11"
flate2 = "1.0"
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
log = "0.4"
mailparse = "0.15"
quick-xml = "0.38"
rumqttc = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
zip = { version = "2.2", default-features = true }
