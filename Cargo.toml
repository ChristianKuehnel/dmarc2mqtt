[package]
name = "dmarc2mqtt"
version = "0.1.0"
edition = "2021"

[dependencies]
flate2 = "1.0"
imap = { version = "2.4", default-features = false }
mailparse = "0.15"
quick-xml = "0.38"
rustls-connector = "0.13"
rumqttc = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
zip = { version = "2.2", default-features = true }
